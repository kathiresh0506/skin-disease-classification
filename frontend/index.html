<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Disease Classifier</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Skin Disease Classification</h1>
            <p class="subtitle">AI-assisted preliminary diagnosis</p>
        </header>
        
        <main>
            <div class="upload-area">
                <label for="image-upload" class="upload-label">
                    <span id="upload-text">Choose an image or drag here</span>
                    <input type="file" id="image-upload" accept="image/*">
                </label>
                <p class="file-help">Supported formats: JPG, PNG (max 5MB)</p>
            </div>
            
            <div class="button-group">
                <button id="analyze-btn" class="primary-btn" disabled>Analyze Image</button>
                <button id="clear-btn" class="secondary-btn">Clear</button>
            </div>
            
            <div id="image-container">
                <img id="image-preview" alt="Preview of uploaded skin condition">
            </div>
            
            <div id="loading" class="loading-indicator">
                <div class="spinner"></div>
                <p>Analyzing image...</p>
            </div>
            
            <div id="result" class="result-container"></div>
            
            <div class="disclaimer">
                <p><strong>Disclaimer:</strong> This tool provides AI-generated information only and is not a substitute for professional medical advice. Always consult a healthcare provider for diagnosis.</p>
            </div>
        </main>
    </div>
    
    <script src="static/script.js"></script>
</body>
</html>
