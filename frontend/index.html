<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Disease Classifier</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Skin Disease Classifier</h1>
      <p>Upload an image to analyze potential skin conditions</p>
    </header>

    <main>
      <div class="upload-area" id="upload-area">
        <i class="fas fa-cloud-upload-alt upload-icon"></i>
        <p id="upload-text">Choose an image or drag here</p>
        <input type="file" id="image-upload" accept="image/*" hidden>
        <img id="image-preview" alt="Image Preview">
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="analyze-btn" disabled>Analyze Image</button>
        <button class="btn btn-outline" id="clear-btn">Clear</button>
      </div>

      <div id="loading">
        <div class="spinner"></div>
      </div>

      <div id="result"></div>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
